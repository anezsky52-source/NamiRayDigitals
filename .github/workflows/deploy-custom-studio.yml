name: Deploy NamiRayDigitals Website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "studio.html"
      - "workspace.html"
      - "ai-gateway.html"
      - "assets/**"
      - "custom-studio/**"
      - ".github/workflows/deploy-custom-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble complete website
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a index.html studio.html workspace.html ai-gateway.html assets custom-studio _site/
          test -s _site/index.html
          test -s _site/studio.html
          test -s _site/workspace.html
          test -s _site/ai-gateway.html
          test -s _site/custom-studio/index.html
          test -s _site/custom-studio/project-memory/index.html
          test -s _site/custom-studio/creative-suite-agent/index.html

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
