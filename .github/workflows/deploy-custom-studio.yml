name: Deploy NamiRayDigitals Custom Studio
# Fresh deployment run: avoid duplicate artifacts from a failed-job rerun.

on:
  push:
    branches: [main]
    paths:
      - "custom-studio/**"
      - ".github/workflows/deploy-custom-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Custom Studio site
        uses: actions/upload-pages-artifact@v3
        with:
          path: custom-studio
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
