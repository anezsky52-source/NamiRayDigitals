name: Studio JavaScript syntax check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, nrd-project-memory-library]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile, sys
          paths = [
              pathlib.Path("custom-studio/project-memory/index.html"),
              pathlib.Path("custom-studio/creative-suite-agent/index.html"),
              pathlib.Path("studio.html"),
          ]
          failed = False
          for path in paths:
              if not path.exists():
                  continue
              html = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script\s*>", html, re.I)
              for number, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as file:
                      file.write(script)
                      file.flush()
                      result = subprocess.run(["node", "--check", file.name], capture_output=True, text=True)
                  if result.returncode:
                      failed = True
                      print(f"FAIL {path} inline script {number}\n{result.stderr}")
                  else:
                      print(f"PASS {path} inline script {number}")
          sys.exit(1 if failed else 0)
          PY
